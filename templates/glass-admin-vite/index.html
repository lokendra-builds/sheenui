<!doctype html>
<html lang="en" data-sheen-style="liquid">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lumen Console: a glass admin dashboard starter built with SheenUI." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 28 10v12L16 29 4 22V10L16 3Z' fill='%236d5efc'/%3E%3C/svg%3E" />
    <title>Lumen Console</title>
    <!-- Restores the saved theme and style before first paint (this is SheenUI's sheenPreferenceScript). -->
    <script>
      (function(){try{var r=document.documentElement;["theme","motion","transparency","glass"].forEach(function(k){var v=localStorage.getItem("sheen:"+k);if(v)r.setAttribute("data-"+k,v);});var s=localStorage.getItem("sheen:style");r.setAttribute("data-sheen-style",s==="liquid"||s==="aurora"?s:"liquid");}catch(e){document.documentElement.setAttribute("data-sheen-style","liquid");}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
